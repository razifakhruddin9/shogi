[package]
name = "shogi-core"
version = "0.1.0"
edition = "2021"
description = "Incremental Rust/WASM core engine port for Shogi Studio (SFEN, 9x9 rules, Alpha-Beta AI)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = "1.0"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
